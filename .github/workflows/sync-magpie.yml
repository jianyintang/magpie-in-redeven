name: Sync Magpie Template

on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the candidate without publishing it
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sync-magpie-template
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'jianyintang/magpie-in-redeven' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      MANIFEST: templates/magpie/redeven-service-template.json
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Test the updater
        run: python3 -B -m unittest discover -s scripts
      - name: Check the latest official Magpie release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/yetone/magpie-releases/releases/latest > "$RUNNER_TEMP/magpie-release.json"
      - name: Resolve pinned images
        run: python3 scripts/sync_magpie.py "$RUNNER_TEMP/magpie-release.json"
      - name: Validate the template with the market and current SDKs
        shell: bash
        run: |
          go run github.com/floegence/redeven-service-templates/cmd/validate-template@v0.8.0 --current ./templates/magpie
          go run github.com/floegence/redeven-service-templates/cmd/validate-template@v0.8.2 --current ./templates/magpie
          git diff --check
          git diff -- "$MANIFEST"
      - name: Publish the validated revision
        if: github.event_name == 'schedule' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- "$MANIFEST"; then
            echo "No update to publish."
            exit 0
          fi
          base=$(git rev-parse HEAD)
          remote=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [[ "$remote" != "$base" ]]; then
            echo "main moved while the candidate was being validated; retry from the new head." >&2
            exit 1
          fi
          version=$(jq -er .recommended_version "$MANIFEST")
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(magpie): update to $version" -- "$MANIFEST"
          gh auth setup-git --hostname github.com
          git push origin HEAD:refs/heads/main
